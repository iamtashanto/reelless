<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M64 12 C92 12 112 24 112 48 C112 86 64 116 64 116 C64 116 16 86 16 48 C16 24 36 12 64 12 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Shield Border -->
  <path d="M64 18 C88 18 106 28 106 50 C106 82 64 108 64 108 C64 108 22 82 22 50 C22 28 40 18 64 18 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="2"/>

  <!-- Play Triangle -->
  <path d="M52 42 L84 64 L52 86 Z" 
        fill="#ffffff" 
        opacity="0.9"/>

  <!-- Diagonal Slash Across Play Button -->
  <line x1="38" y1="90" x2="90" y2="38" 
        stroke="url(#slashGrad)" 
        stroke-width="7" 
        stroke-linecap="round"/>
</svg>
